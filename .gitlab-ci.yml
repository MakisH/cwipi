# Declare stages
stages:
  - init
  - build
  - test
  - deploy
  - coverage

# Default variables and parameters
variables:
  CUSTOM_CI_BUILDS_DIR: $WORKDIR/test # inactif car option non activee dans la configuration du runner
  GIT_STRATEGY: none # don't do anything by default
  # CI_DEBUG_TRACE: "true" #Uncomment to debug CI
default:
  id_tokens:
    CI_JOB_JWT:
      aud: https://gitlab.onera.net
  tags: #All jobs uses jamacar-slurm executor
    - juno-shell

job:init_repo:
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: none
    SCHEDULER_PARAMETERS:  "--qos=co_inter_bigmem  --cpus-per-task=24  --ntasks=1 --time=01:00:00"
  stage: init
  script: # explicitly load modules one by one, so that if one fails, it will be easy to identify
    - echo "Clone directory $PWD"
    - echo "CUSTOM_CI_DIR=$PWD" >> build.env
    - git submodule update --init external/paradigm
  artifacts:
    reports:
      dotenv: build.env

job:build:
  parallel:
    matrix:
        - COMPILER: "gcc@14"
          MPI_LIB:
            - "openmpi"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@12"
          MPI_LIB:
            - "intel-oneapi"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@10"
          MPI_LIB:
            - "openmpi"
          BUILD_TYPE:
            - "Debug"
        - COMPILER: "gcc@10"
          MPI_LIB:
            - "intel-oneapi"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "intel-llvm@2022"
          MPI_LIB:
            - "intel-oneapi"
          BUILD_TYPE:
            - "Debug"
        - COMPILER: "intel@2022"
          MPI_LIB:
            - "intel-oneapi"
          BUILD_TYPE:
            - "Debug"
  variables:
    MATRIX_KEY: _${COMPILER}_${MPI_LIB}_BUILD_${BUILD_TYPE}
  stage: build
  before_script:
    - module purge
    - echo "compilo = $COMPILER"
    - if [ "${COMPILER}" == "gcc@14" ]; then
    -   source /tmp_user/juno/sonics/dist/socle_cfd7/source_gcc14_cython3.sh || true
    - else
    -   source /tmp_user/juno/sonics/dist/source_juno_all.sh --compiler=$COMPILER --mpi=$MPI_LIB || true
    - fi
  script:
    - echo "Runner directory is $PWD; move to working directory $CUSTOM_CI_DIR"
    - cd $CUSTOM_CI_DIR
    - mkdir -p build$MATRIX_KEY && cd build$MATRIX_KEY
    - if   [ "${COMPILER}" == "gcc@14" ]; then
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCWP_ENABLE_EXTERNAL_PDM=OFF -DCWP_ENABLE_PYTHON_BINDINGS=ON  -DCWP_ENABLE_STATIC=OFF -DCWP_ENABLE_SHARED=ON -DCWP_ENABLE_Fortran=ON  -DCWP_ENABLE_Fortran_MPI_MODULE=OFF -DCWP_ENABLE_DOCUMENTATION=OFF -DCWP_ENABLE_BLASLAPACK=OFF -DCWP_ENABLE_CLIENT_SERVER=ON  ../
    - elif [ "${COMPILER}" == "gcc@12" ]; then
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCWP_ENABLE_EXTERNAL_PDM=OFF -DCWP_ENABLE_PYTHON_BINDINGS=ON  -DCWP_ENABLE_STATIC=OFF -DCWP_ENABLE_SHARED=ON -DCWP_ENABLE_Fortran=ON  -DCWP_ENABLE_Fortran_MPI_MODULE=OFF -DCWP_ENABLE_DOCUMENTATION=OFF -DCWP_ENABLE_BLASLAPACK=OFF -DCWP_ENABLE_CLIENT_SERVER=ON  ../
    - elif [ "${COMPILER}" == "gcc@10" ]; then
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCWP_ENABLE_EXTERNAL_PDM=OFF -DCWP_ENABLE_PYTHON_BINDINGS=ON  -DCWP_ENABLE_STATIC=OFF -DCWP_ENABLE_SHARED=ON -DCWP_ENABLE_Fortran=ON  -DCWP_ENABLE_Fortran_MPI_MODULE=ON  -DCWP_ENABLE_DOCUMENTATION=OFF -DCWP_ENABLE_BLASLAPACK=OFF -DCWP_ENABLE_CLIENT_SERVER=ON  ../
    - elif [ "${COMPILER}" == "intel@2022" ]; then
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCWP_ENABLE_EXTERNAL_PDM=OFF -DCWP_ENABLE_PYTHON_BINDINGS=ON  -DCWP_ENABLE_STATIC=OFF -DCWP_ENABLE_SHARED=ON -DCWP_ENABLE_Fortran=ON  -DCWP_ENABLE_Fortran_MPI_MODULE=ON  -DCWP_ENABLE_DOCUMENTATION=ON  -DCWP_ENABLE_BLASLAPACK=OFF -DCWP_ENABLE_CLIENT_SERVER=ON  ../
    - elif [ "${COMPILER}" == "intel-llvm@2022" ]; then
    -   cmake -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCWP_ENABLE_EXTERNAL_PDM=OFF -DCWP_ENABLE_PYTHON_BINDINGS=OFF -DCWP_ENABLE_STATIC=OFF -DCWP_ENABLE_SHARED=ON -DCWP_ENABLE_Fortran=OFF -DCWP_ENABLE_Fortran_MPI_MODULE=OFF -DCWP_ENABLE_DOCUMENTATION=OFF -DCWP_ENABLE_BLASLAPACK=OFF -DCWP_ENABLE_CLIENT_SERVER=OFF ../
    - fi
    - make -j

job:build_coverage:
  stage: build
  before_script:
    - module purge
    - source /tmp_user/juno/sonics/dist/source_juno_all.sh --compiler=gcc@12 --mpi=intel-oneapi || true
  script:
    - cd $CUSTOM_CI_DIR
    - mkdir -p build_coverage && cd build_coverage
    - cmake -DCMAKE_BUILD_TYPE="Coverage" -DCWP_ENABLE_EXTERNAL_PDM=OFF -DCWP_ENABLE_PARMETIS=OFF -DCWP_ENABLE_PTSCOTCH=OFF -DCWP_ENABLE_PYTHON_BINDINGS=ON -DCWP_ENABLE_STATIC=OFF -DCWP_ENABLE_SHARED=ON -DCWP_ENABLE_Fortran=ON -DCWP_ENABLE_Fortran_MPI_MODULE=OFF -DCWP_ENABLE_DOCUMENTATION=OFF -DCWP_ENABLE_BLASLAPACK=OFF -DCWP_ENABLE_PDM_TESTS=OFF -DCWP_ENABLE_CLIENT_SERVER=ON ../
    - make -j

