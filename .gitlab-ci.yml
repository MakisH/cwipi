unit_test:
  parallel:
    matrix:
        - COMPILER: "gcc@14"
          MPI_LIB:
            - "openmpi"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@12"
          MPI_LIB:
            - "intel-oneapi"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "gcc@10"
          MPI_LIB:
            - "openmpi"
          BUILD_TYPE:
            - "Debug"
        - COMPILER: "gcc@10"
          MPI_LIB:
            - "intel-oneapi"
          BUILD_TYPE:
            - "Sanitize"
        - COMPILER: "intel-llvm@2022"
          MPI_LIB:
            - "intel-oneapi"
          BUILD_TYPE:
            - "Debug"
        - COMPILER: "intel@2022"
          MPI_LIB:
            - "intel-oneapi"
          BUILD_TYPE:
            - "Debug"
  variables:
    MATRIX_KEY: _${COMPILER}_${MPI_LIB}_BUILD_${BUILD_TYPE}
    SCHEDULER_PARAMETERS: "--qos=co_inter_bigmem --ntasks=40 --time=01:00:00 --exclusive"
  stage: test
  before_script:
    - module purge
    - echo "compilo = $COMPILER"
    - if [ "${COMPILER}" == "gcc@14" ]; then
    -   source /tmp_user/juno/sonics/dist/socle_cfd7/source_gcc14_cython3.sh || true
    - else
    -   source /tmp_user/juno/sonics/dist/source_juno_all.sh --compiler=$COMPILER --mpi=$MPI_LIB || true
    - fi
  script:
    - echo "Runner directory is $PWD; move to working directory $CUSTOM_CI_DIR"
    - export SLURM_EXACT=1
    - export I_MPI_PMI_LIBRARY=/usr/lib64/libpmi.so
    - cd $CUSTOM_CI_DIR/build$MATRIX_KEY
    - ./cwp_run -ics -timeout 2
  after_script:
    - echo $PWD
    - cd $CI_PROJECT_DIR
    - sed -i '/testsuite name/c\<testsuite name="'"$MATRIX_KEY"'"' cwp_ctest$MATRIX_KEY.xml
    - sed -i 's/" classname/_'"$MATRIX_KEY"'" classname/' cwp_ctest$MATRIX_KEY.xml
  artifacts:
    when: always
    reports:
      junit: cwp_ctest$MATRIX_KEY.xml

job:coverage_report:
  stage: coverage
  before_script:
    - module purge
    - source /tmp_user/juno/sonics/dist/source_juno_all.sh --compiler=gcc@12 --mpi=intel-oneapi || true
  script:
    - export SLURM_EXACT=1
    - export I_MPI_PMI_LIBRARY=/usr/lib64/libpmi.so
    - cd $CUSTOM_CI_DIR/build_coverage
    - ./cwp_run -ics -timeout 2
    - cd $CUSTOM_CI_DIR/build_coverage/src/CMakeFiles/cwp.dir/new
    - gcov -b -l -p -c *.gcno
    - cd $CUSTOM_CI_DIR/build_coverage
    - gcovr --gcov-ignore-parse-errors -g -k --xml-pretty --print-summary --root ${CUSTOM_CI_DIR}/src --object-directory ${CUSTOM_CI_DIR}/build_coverage --output $CI_PROJECT_DIR/coverage.xml
  when: on_success
  coverage: /lines:\s*(\d+\.\d+)%/
  artifacts:
    when: always
    reports:
        coverage_report:
          coverage_format: cobertura
          path: coverage.xml

pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_TAG != null
  before_script:
    - ''
  script:
    - mkdir -p public
    - echo "CI_COMMIT_TAG = ${CI_COMMIT_TAG}"
    - if [ "${CI_COMMIT_TAG}" == "" ]; then
    -   cp -r $CUSTOM_CI_DIR/build_intel@2022_intel-oneapi_BUILD_Debug/doc/sphinx/html public/$CI_COMMIT_BRANCH
    - else
    -   cp -r $CUSTOM_CI_DIR/build_intel@2022_intel-oneapi_BUILD_Debug/doc/sphinx/html public/$CI_COMMIT_TAG
    - fi
  artifacts:
    paths:
      - public
    expire_in: never
